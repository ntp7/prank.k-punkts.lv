<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Picture Word Quiz</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: white;
    }

    body {
      display: flex;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    /*
      The original image is 1908 × 1536.
      Keeping the same aspect ratio ensures the input fields
      remain aligned when the browser window changes size.
    */
    .page {
      position: relative;
      width: min(100vw, 124.22vh);
      aspect-ratio: 1908 / 1536;
      background: white;
    }

    .original {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    .word {
      position: absolute;
      display: grid;
      gap: 1.05%;
      height: 4.3%;
      padding: 0 0.15% 0.5%;
      background: white;
    }

    .word input {
      width: 100%;
      min-width: 0;
      height: 100%;
      padding: 0 0 0.15em;

      border: 0;
      border-bottom: 0.62vw solid black;
      border-radius: 0;
      outline: 0;

      color: #111;
      background: white;

      font-family: Arial, sans-serif;
      font-size: clamp(16px, 2.5vw, 44px);
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
    }

    /* The letters that eventually spell MIKRENE */
    .word input.key {
      border-bottom-color: red;
    }

    .word input:focus {
      background: #fff9bd;
    }

    .word input.key:focus {
      background: #ffe4e4;
    }

    /*
      Position and length of each answer.
      data-key in the HTML chooses which underline is red.
    */
    .word-1 {
      left: 25.8%;
      top: 8.55%;
      width: 46.2%;
      grid-template-columns: repeat(8, 1fr);
    }

    .word-2 {
      left: 25%;
      top: 19.05%;
      width: 57.3%;
      grid-template-columns: repeat(10, 1fr);
    }

    .word-3 {
      left: 25%;
      top: 28.15%;
      width: 23.7%;
      grid-template-columns: repeat(4, 1fr);
    }

    .word-4 {
      left: 27%;
      top: 40.25%;
      width: 26%;
      grid-template-columns: repeat(5, 1fr);
    }

    .word-5 {
      left: 23.4%;
      top: 53.55%;
      width: 35.2%;
      grid-template-columns: repeat(6, 1fr);
    }

    .word-6 {
      left: 29.1%;
      top: 67.15%;
      width: 35.4%;
      grid-template-columns: repeat(6, 1fr);
    }

    .word-7 {
      left: 33.8%;
      top: 79.05%;
      width: 40.4%;
      grid-template-columns: repeat(7, 1fr);
    }

    .hint {
      position: fixed;
      right: 12px;
      bottom: 10px;

      padding: 7px 10px;
      border: 1px solid #ddd;
      border-radius: 7px;

      color: #777;
      background: rgba(255, 255, 255, 0.94);
      font: 12px Arial, sans-serif;
    }

    body.done .hint {
      color: #16833e;
      border-color: #16833e;
    }

    @media print {
      .page {
        width: 100vw;
        height: auto;
      }

      .hint {
        display: none;
      }

      .word input {
        border-bottom-width: 6px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <!-- Your original image -->
    <img
      class="original"
      src="quiz-background.png"
      alt="Picture word puzzle"
    >

    <!--
      data-key determines which letter has a red underline.
      For example, data-key="3" highlights the third letter.
    -->
    <div class="word word-1" data-key="1"></div>
    <div class="word word-2" data-key="2"></div>
    <div class="word word-3" data-key="2"></div>
    <div class="word word-4" data-key="2"></div>
    <div class="word word-5" data-key="5"></div>
    <div class="word word-6" data-key="3"></div>
    <div class="word word-7" data-key="7"></div>
  </main>

  <div class="hint" id="hint">Click a line and type</div>

  <script>
    const words = document.querySelectorAll(".word");

    words.forEach((word, rowIndex) => {
      /*
        The number of CSS grid columns determines how many
        individual letter fields should be created.
      */
      const columns = getComputedStyle(word)
        .gridTemplateColumns
        .split(" ").length;

      const highlightedLetter = Number(word.dataset.key) - 1;

      for (let columnIndex = 0; columnIndex < columns; columnIndex++) {
        const input = document.createElement("input");

        input.maxLength = 1;
        input.autocomplete = "off";
        input.spellcheck = false;
        input.inputMode = "text";

        input.setAttribute(
          "aria-label",
          `Word ${rowIndex + 1}, letter ${columnIndex + 1}`
        );

        if (columnIndex === highlightedLetter) {
          input.classList.add("key");
        }

        input.addEventListener("input", () => {
          /*
            Remove numbers and punctuation, then keep only
            the most recently typed letter.
          */
          input.value = input.value
            .replace(/[^a-zA-ZÀ-ɏ]/g, "")
            .slice(-1);

          if (input.value && input.nextElementSibling) {
            input.nextElementSibling.focus();
          }

          updateStatus();
        });

        input.addEventListener("keydown", event => {
          if (
            event.key === "Backspace" &&
            !input.value &&
            input.previousElementSibling
          ) {
            input.previousElementSibling.focus();
            input.previousElementSibling.value = "";
          }

          if (
            event.key === "ArrowLeft" &&
            input.previousElementSibling
          ) {
            input.previousElementSibling.focus();
          }

          if (
            event.key === "ArrowRight" &&
            input.nextElementSibling
          ) {
            input.nextElementSibling.focus();
          }
        });

        word.appendChild(input);
      }
    });

    function updateStatus() {
      const inputs = [...document.querySelectorAll(".word input")];
      const complete = inputs.every(input => input.value);

      document.body.classList.toggle("done", complete);

      document.querySelector("#hint").textContent = complete
        ? "All fields filled in ✓"
        : "Click a line and type";
    }

    document.querySelector(".word input").focus();
  </script>
</body>
</html>
